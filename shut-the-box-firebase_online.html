<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Shut the Box</title>
<style>
:root{
  --green:#07392d;--brown:#29150d;--brown2:#45281b;
  --gold:#e6bf74;--cream:#f1e5c7;--line:#835131;--muted:#cdbf9e;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#062d24}
body{
 color:var(--cream);
 font-family:Georgia,"Times New Roman",serif;
 background:radial-gradient(circle at 50% -5%,#155b46 0,#0a4436 32%,#062d24 75%);
}
button,input{font:inherit} button{touch-action:manipulation}
.app{
 width:min(100% - 32px, 980px);
 margin:0 auto;
 padding:clamp(24px,5vw,58px) 0 48px;
 min-height:100vh;
}
.brand{text-align:center}
.brand h1{
 margin:0;color:#e4bd75;font-size:clamp(30px,5vw,48px);
 line-height:1.08;letter-spacing:-.8px;
 text-shadow:0 2px 0 #79522a;
}
.tagline{margin-top:8px;color:#dfd5bd;letter-spacing:clamp(1.5px,.35vw,3px);font-size:clamp(14px,2.2vw,20px)}
.round{text-align:center;margin:clamp(28px,5vw,52px) 0 24px;font-size:clamp(19px,3vw,27px);color:#e4d8bb}

.card{
 background:linear-gradient(145deg,#2b170e,#1b0d08);
 border:2px solid var(--line);border-radius:20px;
 box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 10px 30px rgba(0,0,0,.13);
}
.setup{padding:28px clamp(22px,5vw,44px) 24px}
.label{font-size:clamp(15px,2vw,19px);letter-spacing:1px;margin:0 0 12px;color:#dfd5bc}
.player-count{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
.count-btn{
 height:clamp(58px,8vw,76px);border-radius:14px;border:2px solid #71472f;
 color:#ddcfb0;background:transparent;font-weight:bold;font-size:clamp(20px,3vw,26px);
}
.count-btn.active{background:linear-gradient(#e7c47e,#d9ae62);color:#16110d;border-color:#e8c77f}
.name-row{display:grid;grid-template-columns:32px 1fr;align-items:center;margin:11px 0}
.name-num{font-size:17px}
.name-input{
 width:100%;height:clamp(58px,8vw,72px);border-radius:13px;border:2px solid #71472f;
 background:#160b07;color:#f1e5c7;padding:0 18px;font-size:clamp(16px,2.4vw,21px);outline:none;
}
.primary{
 width:100%;height:clamp(60px,8vw,74px);border:0;border-radius:14px;
 background:linear-gradient(#edca81,#dcae61);color:#17110d;
 font-weight:bold;font-size:clamp(17px,2.4vw,21px);margin-top:24px;
}
.help{text-align:center;color:#ddd1b4;font-size:clamp(14px,1.9vw,17px);line-height:1.45;margin:22px 4px 0}
.how{text-align:center;color:#dfd2b3;font-size:clamp(15px,2vw,18px);letter-spacing:1px;margin-top:22px;cursor:pointer}

.scores{
 display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
 gap:12px;margin-bottom:28px;
}
.score-card{
 min-width:0;min-height:132px;padding:16px 15px;border:2px solid #75492f;border-radius:18px;
 background:linear-gradient(145deg,#2a170e,#1d0e09);
}
.score-card.active{border-color:#d7af65;box-shadow:0 0 0 3px rgba(218,179,101,.12)}
.score-name{font-size:clamp(16px,2.3vw,21px);font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:#e8c87f;margin-right:7px;vertical-align:2px}
.score-label{font-family:monospace;font-size:clamp(13px,1.8vw,17px);color:#d6c9aa;margin-top:10px}
.score-value{font-family:monospace;font-size:20px;color:#e5d5b3;margin-top:5px}.pending-value{font-family:monospace;font-size:14px;color:#bfae8d;margin-top:4px}

.board{
 padding:clamp(18px,3vw,28px);
 background:linear-gradient(145deg,#51301f,#3a2116);
 border:2px solid #734a30;border-radius:24px;
}
.board-inner{
 background:linear-gradient(#083c2f,#052c23);
 border:2px solid #1b5949;border-radius:18px;
 padding:clamp(20px,3vw,28px) clamp(10px,2vw,18px) 22px;
 overflow:hidden;
}
.turn{text-align:center;font-size:clamp(20px,3vw,29px);font-weight:bold;margin:0 0 20px;color:#e7d7b6}
.tiles{
 display:grid;grid-template-columns:repeat(5,minmax(0,1fr));
 gap:clamp(4px,1vw,9px);
 width:100%;
}
.tile{
 width:100%;min-width:0;aspect-ratio:1/1.05;border-radius:9px;border:2px solid #b89a61;
 background:linear-gradient(#f1dfac,#ddc88f);color:#17120e;
 font-size:clamp(17px,3vw,28px);font-weight:bold;position:relative;
 box-shadow:inset 0 1px 0 #fff4c9;padding:0;
}
.tile:before{content:"";position:absolute;width:6px;height:6px;border-radius:50%;background:#c9a965;top:5px;left:50%;transform:translateX(-50%)}
.tile.closed{background:#1b1712;border-color:#514637;color:#5c5548;box-shadow:none}
.tile.closed:before{background:#403a31}
.tile.selected{background:linear-gradient(#f5d68e,#d6a950);border-color:#fff0bd;transform:translateY(-2px)}
.dice-zone{text-align:center;padding:26px 0 12px}
.dice{display:flex;justify-content:center;gap:14px}
.die{
 width:clamp(58px,10vw,76px);height:clamp(58px,10vw,76px);border-radius:14px;background:#f7f0dc;color:#16110d;
 display:grid;place-items:center;font-size:clamp(30px,5vw,40px);font-weight:bold;
 box-shadow:0 6px 15px rgba(0,0,0,.3);
}

.dice.rolling .die{
  animation:diceTumble .12s steps(1,end) infinite;
}
.dice.rolling .die:nth-child(2){animation-delay:.035s}
@keyframes diceTumble{
  0%{transform:rotate(-9deg) translate(-3px,-2px)}
  25%{transform:rotate(8deg) translate(3px,2px)}
  50%{transform:rotate(-5deg) translate(1px,-3px)}
  75%{transform:rotate(7deg) translate(-2px,2px)}
  100%{transform:rotate(0) translate(0,0)}
}
.dice.rolling{
  filter:drop-shadow(0 7px 9px rgba(0,0,0,.25));
}

.dice.rolling .die{animation:dice3D .13s linear infinite}
.dice.rolling .die:nth-child(2){animation-delay:.04s}
.dice.settling .die{animation:diceSettle .45s cubic-bezier(.18,.9,.25,1)}
@keyframes dice3D{
 0%{transform:rotateX(0) rotateY(0) translate(-2px,0)}
 25%{transform:rotateX(95deg) rotateY(75deg) translate(2px,-3px)}
 50%{transform:rotateX(190deg) rotateY(155deg) translate(0,2px)}
 75%{transform:rotateX(275deg) rotateY(245deg) translate(-2px,-2px)}
 100%{transform:rotateX(360deg) rotateY(360deg) translate(0,0)}
}
@keyframes diceSettle{
 0%{transform:rotateX(35deg) rotateY(-25deg) scale(1.08)}
 45%{transform:rotateX(-10deg) rotateY(8deg) scale(.96)}
 75%{transform:rotateX(5deg) rotateY(-3deg) scale(1.02)}
 100%{transform:rotateX(0) rotateY(0) scale(1)}
}
.turn-delay{
 position:fixed;inset:0;background:rgba(2,20,16,.82);z-index:30;
 display:grid;place-items:center;text-align:center;padding:25px;
}
.turn-delay-box{
 width:min(92vw,430px);padding:34px 24px;border-radius:20px;
 background:linear-gradient(145deg,#2b170e,#160b07);
 border:2px solid #835131;box-shadow:0 18px 50px rgba(0,0,0,.45);
}
.turn-delay-small{font-size:18px;color:#d8cbae}
.turn-delay-name{font-size:clamp(30px,7vw,42px);font-weight:bold;color:#e6bd73;margin:12px 0}
.turn-delay-text{font-size:16px;color:#cfc3a5}
.dice-total{font-family:monospace;font-size:15px;margin-top:10px;color:#d8cbae}
.dice-total b{color:#f2dfb4;font-size:19px}
.status{text-align:center;font-size:clamp(17px,2.5vw,22px);font-weight:bold;color:#e6dac0;margin:18px auto;max-width:650px}
.action-wrap{text-align:center}
.roll{
 min-width:min(230px,70vw);height:clamp(58px,8vw,72px);border:0;border-radius:14px;
 background:linear-gradient(#edca81,#dcae61);color:#17110d;font-weight:bold;font-size:clamp(19px,2.8vw,24px);
}
.roll:disabled{opacity:.5}
.secondary{
 display:block;margin:12px auto 0;background:transparent;color:#decfb0;
 border:1px solid #825031;padding:9px 16px;border-radius:10px;font-size:15px
}
.bottom-btn{
 width:100%;height:clamp(58px,8vw,72px);margin-top:24px;border:2px solid #7b4d31;border-radius:14px;
 background:transparent;color:#e0d3b6;font-size:clamp(17px,2.4vw,21px)
}
.pass{padding:clamp(45px,8vw,75px) clamp(22px,6vw,50px);text-align:center}
.pass-small{font-size:clamp(20px,3vw,25px);color:#dfd4ba;margin-bottom:22px}
.pass-name{font-size:clamp(34px,6vw,46px);font-weight:bold;color:#e4bd75;margin-bottom:22px}
.pass-hint{font-size:clamp(18px,3vw,23px);color:#ded3ba;margin-bottom:28px}
.pass .primary{margin-top:0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:20px;z-index:20}
.modal-box{width:min(100%,500px);padding:30px 24px;text-align:center}
.modal-box h2{font-size:clamp(28px,5vw,36px);color:#e6bd73;margin:5px 0 15px}
.modal-box p{font-size:18px;color:#ded3bb;line-height:1.5}
.hidden{display:none!important}

@media(max-width:700px){
 .app{width:min(100% - 28px,620px)}
 .scores{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(min-width:701px){
 .game-layout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(260px,.75fr);gap:20px}
}
@media(max-width:420px){
 .app{width:calc(100% - 20px);padding-top:28px}
 .brand h1{font-size:31px}
 .tagline{font-size:13px}
 .round{margin-top:28px}
 .scores{gap:8px}
 .score-card{min-height:116px;padding:13px 11px}
 .board{padding:14px;border-radius:19px}
 .board-inner{padding:19px 7px}
 .turn{margin-bottom:15px}
 .tiles{gap:3px}
 .tile{border-width:1.5px;font-size:16px}
 .tile:before{width:4px;height:4px;top:4px}
}
@media(min-width:1100px){
 .app{max-width:1050px}
}

@media (min-width:701px){
  body{overflow-x:hidden}
  .board{box-shadow:inset 0 2px 0 rgba(255,224,164,.25),inset 0 -5px 0 rgba(40,17,8,.38),0 8px 18px rgba(0,0,0,.32)}
  .app{width:min(94vw,920px);padding:24px 0 28px}
  .brand h1{font-size:36px;letter-spacing:-.5px}
  .tagline{font-size:14px;letter-spacing:2px;margin-top:5px}
  .round{margin:24px 0 16px;font-size:20px}
  .scores{gap:10px;margin-bottom:18px}
  .score-card{min-height:94px;padding:11px 13px;border-radius:14px}
  .score-name{font-size:18px}
  .score-label{font-size:12px;margin-top:6px}
  .score-value{font-size:17px;margin-top:3px}
  .pending-value{font-size:11px;margin-top:2px}
  .board{padding:14px;border-radius:18px}
  .board-inner{padding:14px 18px 17px;border-radius:14px}
  .turn{font-size:21px;margin-bottom:13px}
  .tiles{gap:7px}
  .tile{aspect-ratio:1.35;font-size:22px;border-radius:8px}
  .tile:before{width:5px;height:5px;top:5px}
  .dice-zone{padding:13px 0 7px}
  .die{width:58px;height:58px;font-size:30px;border-radius:11px}
  .dice-total{font-size:12px;margin-top:6px}
  .dice-total b{font-size:15px}
  .status{margin:10px auto;font-size:16px}
  .roll{min-width:170px;height:52px;font-size:18px;border-radius:11px}
  .secondary{margin-top:7px;padding:6px 12px;font-size:13px}
  .bottom-btn{height:48px;margin-top:14px;font-size:16px;border-radius:11px}
  .how{font-size:14px;margin-top:12px}
  .pass{padding:40px 30px 42px}
  .pass-small{font-size:19px;margin-bottom:15px}
  .pass-name{font-size:34px;margin-bottom:15px}
  .pass-hint{font-size:18px;margin-bottom:20px}
  .pass .primary{height:55px;font-size:18px}
  .setup{max-width:650px;margin:0 auto;padding:22px 30px 20px}
  .setup .count-btn{height:58px;font-size:20px}
  .setup .name-input{height:55px;font-size:17px}
  .setup .primary{height:58px;font-size:19px;margin-top:18px}
  .setup .label{font-size:15px}
  .setup .help{font-size:13px;margin-top:15px}
  .setup .how{font-size:14px;margin-top:14px}
}
@media (min-width:701px) and (max-height:850px){
  .app{padding-top:15px;padding-bottom:18px}
  .brand h1{font-size:31px}
  .tagline{font-size:12px}
  .round{margin:14px 0 11px;font-size:17px}
  .scores{margin-bottom:12px}
  .score-card{min-height:78px;padding:8px 11px}
  .score-name{font-size:16px}
  .score-label{font-size:10px;margin-top:3px}
  .score-value{font-size:15px}
  .pending-value{font-size:9px}
  .board{padding:10px}
  .board-inner{padding:10px 14px 12px}
  .turn{font-size:18px;margin-bottom:8px}
  .tiles{gap:5px}
  .tile{font-size:18px;border-radius:7px}
  .tile:before{width:4px;height:4px;top:4px}
  .dice-zone{padding:8px 0 4px}
  .die{width:48px;height:48px;font-size:25px}
  .status{font-size:14px;margin:7px auto}
  .roll{height:45px;font-size:16px}
  .bottom-btn{height:40px;margin-top:9px;font-size:14px}
  .how{font-size:12px;margin-top:8px}
}


/* Wooden Shut-the-Box board */
.board{
  background:
    linear-gradient(90deg,rgba(80,38,16,.30) 0 2px,transparent 2px 12px),
    linear-gradient(0deg,rgba(255,205,130,.08),rgba(70,30,12,.16)),
    #6b351d;
  border:3px solid #4b2515;
  box-shadow:
    inset 0 2px 0 rgba(255,224,164,.25),
    inset 0 -5px 0 rgba(40,17,8,.38),
    0 10px 22px rgba(0,0,0,.35);
  position:relative;
}
.board:before{
  content:"";
  position:absolute;
  inset:5px;
  border:1px solid rgba(238,190,111,.35);
  border-radius:14px;
  pointer-events:none;
}
.board-inner{
  background:
    linear-gradient(90deg,rgba(255,255,255,.035),transparent 18%,rgba(0,0,0,.08) 70%,transparent),
    #073f32;
  border:3px solid #432313;
  box-shadow:
    inset 0 5px 10px rgba(0,0,0,.30),
    inset 0 -2px 0 rgba(255,255,255,.05);
}
.tiles{
  padding:7px;
  border-radius:12px;
  background:
    linear-gradient(90deg,rgba(78,37,17,.22),transparent 30%,rgba(78,37,17,.20)),
    #174d3d;
  box-shadow:inset 0 3px 7px rgba(0,0,0,.32);
}
.tile{
  position:relative;
  border:2px solid #9c743a;
  border-radius:9px;
  color:#302015;
  background:
    linear-gradient(135deg,rgba(255,255,255,.45),transparent 25%),
    linear-gradient(90deg,rgba(129,84,35,.10),transparent 20%,rgba(129,84,35,.12)),
    #e7c77f;
  box-shadow:
    inset 0 1px 0 rgba(255,248,215,.9),
    inset 0 -4px 0 rgba(121,79,30,.20),
    0 3px 4px rgba(0,0,0,.30);
  text-shadow:0 1px 0 rgba(255,244,205,.55);
  transition:transform .12s ease,box-shadow .12s ease,background .12s ease;
}
.tile:hover:not(:disabled){
  transform:translateY(-2px);
  box-shadow:
    inset 0 1px 0 rgba(255,248,215,.9),
    inset 0 -4px 0 rgba(121,79,30,.20),
    0 6px 8px rgba(0,0,0,.30);
}
.tile:active:not(:disabled){transform:translateY(1px)}
.tile.selected{
  background:
    linear-gradient(135deg,rgba(255,255,255,.38),transparent 25%),
    #d4a955;
  border-color:#f1ce78;
  box-shadow:
    inset 0 1px 0 rgba(255,250,220,.9),
    0 0 0 2px rgba(240,195,105,.35),
    0 5px 8px rgba(0,0,0,.35);
}
.tile.closed{
  color:#bca98c;
  background:
    linear-gradient(135deg,rgba(255,255,255,.04),transparent),
    #3d3029;
  border-color:#5d4a3d;
  box-shadow:inset 0 4px 8px rgba(0,0,0,.30);
  opacity:.72;
}
.tile:before{
  background:#bd9550!important;
  box-shadow:inset 0 1px 1px rgba(255,235,175,.55);
}


/* Individual wooden sliding shutters */
.tile{
  overflow:hidden;
  isolation:isolate;
  transform-origin:center bottom;
  background:
    linear-gradient(90deg,rgba(86,47,20,.18),transparent 12%,rgba(255,242,192,.22) 48%,transparent 88%,rgba(83,44,18,.14)),
    linear-gradient(180deg,#f0d894 0%,#d9b866 48%,#c89e4e 100%);
  border:2px solid #9a7134;
  border-top-color:#caa35d;
  border-bottom-color:#795322;
  border-radius:8px 8px 5px 5px;
  box-shadow:
    inset 0 2px 0 rgba(255,250,220,.85),
    inset 0 -5px 0 rgba(105,65,22,.24),
    inset 3px 0 0 rgba(255,238,180,.22),
    inset -3px 0 0 rgba(89,51,18,.12),
    0 4px 5px rgba(0,0,0,.34);
  transition:transform .16s ease,filter .16s ease,box-shadow .16s ease;
}

/* A pair of subtle vertical wood-grain lines */
.tile:after{
  content:"";
  position:absolute;
  top:9%;
  bottom:8%;
  left:18%;
  width:2px;
  background:rgba(102,64,25,.11);
  box-shadow:
    34px 0 0 rgba(255,245,200,.10),
    70px 0 0 rgba(103,64,25,.07);
  pointer-events:none;
  z-index:-1;
}

.tile:before{
  width:9px!important;
  height:9px!important;
  top:6px!important;
  left:50%!important;
  transform:translateX(-50%);
  border-radius:50%;
  background:
    radial-gradient(circle at 35% 30%,#fff2bb 0 14%,#b8863e 42%,#78501e 100%)!important;
  border:1px solid #79501f;
  box-shadow:
    0 1px 2px rgba(0,0,0,.35),
    inset 0 1px 1px rgba(255,245,190,.7)!important;
}

/* Number is engraved/printed into the wooden face */
.tile{
  font-family:Georgia,serif;
  font-weight:700;
  text-shadow:
    0 1px 0 rgba(255,239,190,.55),
    0 -1px 0 rgba(71,40,16,.15);
}

.tile:hover:not(:disabled){
  transform:translateY(-3px);
  filter:brightness(1.04);
  box-shadow:
    inset 0 2px 0 rgba(255,250,220,.85),
    inset 0 -5px 0 rgba(105,65,22,.24),
    0 7px 9px rgba(0,0,0,.34);
}

.tile:active:not(:disabled){
  transform:translateY(2px);
  box-shadow:
    inset 0 4px 6px rgba(71,38,14,.25),
    0 1px 2px rgba(0,0,0,.28);
}

/* Shut/slid-down state: recessed behind the board */
.tile.closed{
  transform:translateY(5px) scale(.985);
  color:#897967;
  background:
    linear-gradient(90deg,rgba(0,0,0,.10),transparent 15%,rgba(255,255,255,.035) 50%,transparent 85%,rgba(0,0,0,.10)),
    #65574c;
  border-color:#51443a;
  border-top-color:#75665a;
  border-bottom-color:#332a24;
  box-shadow:
    inset 0 5px 9px rgba(0,0,0,.42),
    inset 0 1px 0 rgba(255,255,255,.08),
    0 1px 1px rgba(0,0,0,.22);
  opacity:.82;
}

.tile.closed:before{
  background:
    radial-gradient(circle at 35% 30%,#b7a58e 0 12%,#625548 45%,#3d332c 100%)!important;
  border-color:#4b4037;
}

/* Selected shutter looks lifted and highlighted */
.tile.selected{
  transform:translateY(-4px);
  background:
    linear-gradient(90deg,rgba(105,64,19,.16),transparent 12%,rgba(255,248,202,.30) 48%,transparent 88%,rgba(91,53,16,.14)),
    linear-gradient(180deg,#f7dfa0,#e2bd68 52%,#d2a652);
  border-color:#f0cf78;
  box-shadow:
    inset 0 2px 0 rgba(255,255,235,.9),
    inset 0 -5px 0 rgba(119,74,21,.20),
    0 0 0 2px rgba(238,195,102,.28),
    0 8px 12px rgba(0,0,0,.38);
}

/* Add a physical-looking slot beneath the shutters */
.tiles{
  position:relative;
  padding:10px 8px 13px;
}
.tiles:before{
  content:"";
  position:absolute;
  left:7px;right:7px;bottom:5px;
  height:5px;
  border-radius:4px;
  background:#2b211b;
  box-shadow:inset 0 2px 3px rgba(0,0,0,.65),0 1px 0 rgba(255,220,150,.08);
  pointer-events:none;
  z-index:0;
}
.tile{z-index:1}

</style>
</head>
<body>
<div id="app" class="app"></div>
<div id="modal" class="modal hidden"></div>


<style>
.firebase-status{margin:10px auto 18px;text-align:center;font-size:13px;color:#b9d7cb}
.firebase-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#7bc47b;margin-right:6px}
.lobby-card{padding:26px clamp(20px,4vw,34px)}
.room-code{
 font-family:monospace;letter-spacing:6px;font-size:clamp(30px,7vw,46px);
 color:#f0ca7e;font-weight:bold;margin:10px 0 6px;
}
.room-sub{color:#d5c8aa;font-size:15px;margin-bottom:22px}
.join-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.join-row input{height:56px}
.player-list{margin:18px 0;border-top:1px solid #6e472f;border-bottom:1px solid #6e472f}
.player-line{display:flex;align-items:center;justify-content:space-between;padding:12px 4px;border-bottom:1px solid rgba(131,81,49,.35)}
.player-line:last-child{border-bottom:0}
.player-seat{font-weight:bold;color:#e4bd75}
.player-uid{font-size:12px;color:#9d927e}
.small-btn{height:48px;padding:0 16px;border-radius:11px;border:1px solid #80502f;background:transparent;color:#dfd1b2}
.error{color:#f1a7a0;text-align:center;margin:12px 0;font-size:14px}
.notice{color:#d8cbae;text-align:center;margin:12px 0;font-size:14px;line-height:1.4}
.room-top{text-align:center}
.copy-btn{margin:4px auto 0}
.host-badge{font-size:11px;color:#e6bf74;border:1px solid #805b32;padding:2px 6px;border-radius:8px;margin-left:6px}
.sync-pill{text-align:center;font-size:12px;color:#a9c7bb;margin:7px 0 12px}
@media(max-width:520px){.join-row{grid-template-columns:1fr}.join-row .primary{margin-top:0}}
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import {
  getAuth, signInAnonymously, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import {
  getDatabase, ref, get, set, update, onValue, runTransaction, onDisconnect, serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAWp5SC1jyC2vXcfFPY99oDy4Nc8ZCJx8",
  authDomain: "shut-the-box-22049.firebaseapp.com",
  databaseURL: "https://shut-the-box-22049-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "shut-the-box-22049",
  storageBucket: "shut-the-box-22049.firebasestorage.app",
  messagingSenderId: "443593231675",
  appId: "1:443593231675:web:3d8a31a8c0d27accd4bb1e"
};

const firebaseApp = initializeApp(firebaseConfig);
const auth = getAuth(firebaseApp);
const db = getDatabase(firebaseApp);

const app=document.getElementById("app"), modal=document.getElementById("modal");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const cleanName=s=>String(s??"").trim().slice(0,16);
const roomKey=s=>String(s??"").trim().toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,6);
const makeRoom=()=>{const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let s="";for(let i=0;i<6;i++)s+=chars[Math.floor(Math.random()*chars.length)];return s};

let currentUser=null, roomId=null, roomData=null, unsubscribeRoom=null, busy=false, errorText="";
const S={screen:"setup", players:2, names:["","","",""], maxRounds:5, localSeat:null};

function showError(msg){errorText=msg;render();}
function clearError(){errorText="";}
function playerEntries(d){
  return Object.entries(d?.players||{}).sort((a,b)=>(a[1].seat??99)-(b[1].seat??99));
}
function myPlayer(d=roomData){return currentUser&&d?.players?.[currentUser.uid] ? d.players[currentUser.uid] : null}
function playerName(d,uid){return cleanName(d?.players?.[uid]?.name)||`Player ${(d?.players?.[uid]?.seat??0)+1}`}

function localGameState(d){
  if(!d)return;
  const entries=playerEntries(d);
  S.players=entries.length;
  S.names=Array(4).fill("");
  entries.forEach(([uid,p])=>{S.names[p.seat]=p.name||`Player ${p.seat+1}`});
  S.localSeat=myPlayer(d)?.seat ?? null;
}

function render(){
  if(!currentUser){
    app.innerHTML=`<div class="brand"><h1>Shut the Box</h1><div class="tagline">CONNECTING TO FIREBASE…</div></div>`;
    return;
  }
  if(S.screen==="setup") renderSetup();
  else if(S.screen==="lobby") renderLobby();
  else if(S.screen==="game") renderGame();
}

function renderFirebaseStatus(){
 return `<div class="firebase-status"><span class="firebase-dot"></span>Online · Firebase connected</div>`;
}

function renderSetup(){
 app.innerHTML=`
 <div class="brand"><h1>Shut the Box</h1><div class="tagline">2–4 PLAYERS · ONLINE</div></div>
 ${renderFirebaseStatus()}
 <section class="card setup">
  <p class="label">NUMBER OF PLAYERS</p>
  <div class="player-count">${[2,3,4].map(n=>`<button class="count-btn ${S.players===n?"active":""}" onclick="setPlayers(${n})">${n}</button>`).join("")}</div>
  <p class="label">YOUR NAME</p>
  <div class="name-row"><div class="name-num">1.</div>
   <input id="hostName" class="name-input" maxlength="16" value="${esc(S.names[0])}" placeholder="Your name">
  </div>
  <button class="primary" onclick="createGame()">Create game</button>
  <div class="help">Create a room and share the 6-character code with the other players.<br>Each player joins from their own phone, tablet or computer.</div>
  <div class="how" onclick="showRules()">▶ HOW TO PLAY</div>
 </section>
 <section class="card lobby-card" style="margin-top:16px">
  <p class="label">JOIN A GAME</p>
  <div class="join-row">
    <input id="joinCode" class="name-input" maxlength="6" placeholder="ROOM CODE" style="text-transform:uppercase;letter-spacing:3px">
    <input id="joinName" class="name-input" maxlength="16" placeholder="Your name">
  </div>
  <button class="primary" onclick="joinGame()">Join game</button>
  ${errorText?`<div class="error">${esc(errorText)}</div>`:""}
 </section>`;
}

function setPlayers(n){S.players=n;S.names=Array(4).fill("");clearError();render();}

function initialGame(maxPlayers,hostUid,hostName){
  const players={};
  players[hostUid]={name:hostName,seat:0,score:0,open:Object.fromEntries(Array.from({length:10},(_,i)=>[String(i+1),true])),connected:true};
  return {
    status:"lobby",maxPlayers,maxRounds:5,round:1,currentSeat:0,turnNo:1,
    hostUid,playerOrder:{0:hostUid},seats:{0:hostUid},players,
    lastRoll:null,selection:null,roundMessage:null,createdAt:serverTimestamp()
  };
}

async function createGame(){
 if(busy)return;
 const name=cleanName(document.getElementById("hostName")?.value);
 if(!name){showError("Please enter your name.");return;}
 busy=true;clearError();render();
 try{
   let id=makeRoom(), attempts=0, existing;
   do{existing=await get(ref(db,`games/${id}`));if(existing.exists()){id=makeRoom();attempts++}}while(existing.exists()&&attempts<5);
   const data=initialGame(S.players,currentUser.uid,name);
   await set(ref(db,`games/${id}`),data);
   roomId=id;roomData=data;S.localSeat=0;S.screen="lobby";subscribeRoom();
 }catch(e){showError("Could not create the game. Check Firebase Database rules.");console.error(e)}
 finally{busy=false;render();}
}

async function joinGame(){
 if(busy)return;
 const id=roomKey(document.getElementById("joinCode")?.value), name=cleanName(document.getElementById("joinName")?.value);
 if(id.length!==6){showError("Enter the 6-character room code.");return;}
 if(!name){showError("Please enter your name.");return;}
 busy=true;clearError();render();
 try{
   const r=ref(db,`games/${id}`);
   const snap=await get(r);
   if(!snap.exists())throw new Error("ROOM_NOT_FOUND");
   const room=snap.val();
   if(room.status!=="lobby")throw new Error("GAME_STARTED");
   if(room.players?.[currentUser.uid]){roomId=id;S.screen="lobby";subscribeRoom();return;}
   let claimedSeat=null;
   for(let seat=1;seat<room.maxPlayers;seat++){
     const seatRef=ref(db,`games/${id}/seats/${seat}`);
     const result=await runTransaction(seatRef,current=>current===null?currentUser.uid:current);
     if(result.committed && result.snapshot.val()===currentUser.uid){claimedSeat=seat;break;}
   }
   if(claimedSeat===null)throw new Error("ROOM_FULL");
   const player={name,seat:claimedSeat,score:0,open:Object.fromEntries(Array.from({length:10},(_,i)=>[String(i+1),true])),connected:true};
   try{
     await set(ref(db,`games/${id}/players/${currentUser.uid}`),player);
     await set(ref(db,`games/${id}/playerOrder/${claimedSeat}`),currentUser.uid);
   }catch(e){
     try{await set(ref(db,`games/${id}/seats/${claimedSeat}`),null);}catch(_){ }
     throw e;
   }
   roomId=id;S.screen="lobby";subscribeRoom();
 }catch(e){
   const msg=e.message==="ROOM_NOT_FOUND"?"Room not found.":e.message==="GAME_STARTED"?"This game has already started.":e.message==="ROOM_FULL"?"The room is full.":(e.code==="PERMISSION_DENIED"?"Database permission denied — check the Firebase rules.":"Could not join the game.");
   showError(msg);console.error(e);
 }finally{busy=false;render();}
}
function subscribeRoom(){
 if(unsubscribeRoom)unsubscribeRoom();
 if(!roomId)return;
 unsubscribeRoom=onValue(ref(db,`games/${roomId}`),snap=>{
   roomData=snap.val();
   if(!roomData){showError("This room no longer exists.");roomId=null;S.screen="setup";render();return;}
   localGameState(roomData);
   if(roomData.status==="lobby")S.screen="lobby";
   else if(roomData.status==="playing")S.screen="game";
   else if(roomData.status==="roundResult")S.screen="game";
   else if(roomData.status==="gameOver")S.screen="game";
   render();
 },err=>{
   console.error(err);showError("Unable to read this room. Check Database rules.");render();
 });
}

async function setConnected(value){
 if(!roomId||!currentUser)return;
 try{
   await update(ref(db,`games/${roomId}/players/${currentUser.uid}`),{connected:value});
 }catch(e){}
}

function renderLobby(){
 const d=roomData, entries=playerEntries(d), mine=myPlayer(d), full=entries.length===d.maxPlayers;
 app.innerHTML=`
 <div class="brand"><h1>Shut the Box</h1><div class="tagline">ONLINE GAME</div></div>
 ${renderFirebaseStatus()}
 <section class="card lobby-card">
   <div class="room-top">
     <div class="label">ROOM CODE</div>
     <div class="room-code">${esc(roomId)}</div>
     <button class="small-btn copy-btn" onclick="copyRoom()">Copy code</button>
     <div class="room-sub">${full?"All players joined.":"Waiting for players…"} ${entries.length}/${d.maxPlayers}</div>
   </div>
   <div class="player-list">
    ${Array.from({length:d.maxPlayers},(_,seat)=>{
      const x=entries.find(([uid,p])=>p.seat===seat);
      return `<div class="player-line"><span><span class="player-seat">Player ${seat+1}</span> ${x?esc(x[1].name):'<span style="color:#8f806d">Waiting…</span>'}${x&&x[0]===d.hostUid?'<span class="host-badge">HOST</span>':""}</span>${x?'<span>✓</span>':''}</div>`;
    }).join("")}
   </div>
   ${d.hostUid===currentUser.uid&&full?`<button class="primary" onclick="startOnlineGame()">Start game</button>`:`<div class="notice">${d.hostUid===currentUser.uid?"Share the code, then start when everyone has joined.":"Waiting for the host to start the game."}</div>`}
   ${errorText?`<div class="error">${esc(errorText)}</div>`:""}
   <button class="bottom-btn" onclick="leaveRoom()">Leave room</button>
 </section>
 <div class="how" onclick="showRules()">▶ HOW TO PLAY</div>`;
}

async function copyRoom(){
 try{await navigator.clipboard.writeText(roomId);showToast("Room code copied");}
 catch(e){showToast("Room code: "+roomId);}
}
function showToast(text){
 modal.innerHTML=`<div class="card modal-box"><h2>✓</h2><p>${esc(text)}</p></div>`;
 modal.classList.remove("hidden");setTimeout(()=>modal.classList.add("hidden"),1100);
}

async function startOnlineGame(){
 if(!roomId||roomData.hostUid!==currentUser.uid)return;
 const players=playerEntries(roomData);
 if(players.length!==roomData.maxPlayers)return;
 const open=Object.fromEntries(Array.from({length:10},(_,i)=>[String(i+1),true]));
 const updates={status:"playing",round:1,currentSeat:0,turnNo:1,lastRoll:null,selection:null,roundMessage:null};
 players.forEach(([uid,p])=>{updates[`players/${uid}/score`]=0;updates[`players/${uid}/open`]=open;});
 await update(ref(db,`games/${roomId}`),updates);
}

function openNumbers(p){return Object.entries(p?.open||{}).filter(([,v])=>v).map(([n])=>Number(n)).sort((a,b)=>a-b);}
function currentUid(d){return d?.playerOrder?.[String(d.currentSeat)]||null}
function isMyTurn(){return !!roomData&&roomData.status==="playing"&&currentUid(roomData)===currentUser.uid}
function combinations(nums,target,start=0){
 if(target===0)return true;
 for(let i=start;i<nums.length;i++)if(nums[i]<=target&&combinations(nums,target-nums[i],i+1))return true;
 return false;
}
function pendingValue(nums){return nums.reduce((a,b)=>a+b,0)}

function renderScores(){
 const d=roomData;
 return `<div class="scores">${playerEntries(d).map(([uid,p])=>{
  const nums=openNumbers(p), pending=pendingValue(nums);
  return `<div class="score-card ${p.seat===d.currentSeat?"active":""}">
   <div class="score-name">${p.seat===d.currentSeat?'<span class="dot"></span>':''}${esc(p.name||`Player ${p.seat+1}`)}</div>
   <div class="score-label">Total value</div><div class="score-value">${p.score||0}</div>
   <div class="pending-value">This round: ${pending}</div>
  </div>`;
 }).join("")}</div>`;
}

function renderGame(){
 const d=roomData;
 if(d.status==="gameOver"){renderGameOver();return;}
 if(d.status==="roundResult"){renderRoundResult();return;}
 const uid=currentUid(d), me=myPlayer(d), name=esc(me?.name||"Player");
 const nums=openNumbers(me), dice=d.lastRoll, myTurn=uid===currentUser.uid;
 const selected=Object.keys(d.selection||{}).filter(n=>d.selection[n]).map(Number).sort((a,b)=>a-b);
 const total=dice?.total||0, sum=selected.reduce((a,b)=>a+b,0);
 app.innerHTML=`
 <div class="brand"><h1>Shut the Box</h1><div class="tagline">2–4 PLAYERS · ONLINE</div></div>
 ${renderFirebaseStatus()}
 <div class="round">Round ${d.round} / ${d.maxRounds}</div>
 ${renderScores()}
 <section class="card board">
  <div class="board-inner">
   <div class="turn">${esc(playerName(d,uid))}'s turn</div>
   <div class="sync-pill">Room ${esc(roomId)} · Turn ${d.turnNo}</div>
   <div class="tiles">${Array.from({length:10},(_,i)=>{
     const n=i+1,closed=!nums.includes(n),sel=selected.includes(n);
     return `<button class="tile ${closed?"closed":""} ${sel?"selected":""}" ${closed||!myTurn||!dice||d.selection===null?"disabled":""} onclick="toggleOnline(${n})">${n}</button>`;
   }).join("")}</div>
  </div>
  ${dice?`<div class="dice-zone">
    <div class="dice ${d.animating?"rolling":""}"><div class="die">${dice.d1}</div><div class="die">${dice.d2}</div></div>
    <div class="dice-total">Dice total: <b>${dice.total}</b></div>
  </div>`:""}
 </section>
 <div class="status">${onlineStatus(d,name,nums,myTurn)}</div>
 <div class="action-wrap">
   ${myTurn&&d.selection===null?`<button class="roll" onclick="rollOnline()">Roll dice</button>`:""}
   ${myTurn&&d.selection!==null?`<button class="secondary" onclick="clearOnlineSelection()">Clear selection</button>`:""}
 </div>
 <button class="bottom-btn" onclick="leaveRoom()">Leave game</button>
 <div class="how" onclick="showRules()">▶ HOW TO PLAY</div>`;
}

function onlineStatus(d,name,nums,myTurn){
 if(!myTurn)return `Waiting for ${esc(playerName(d,currentUid(d)))} to play…`;
 if(!d.lastRoll)return `${name}'s turn — roll both dice to begin.`;
 const selected=Object.keys(d.selection||{}).filter(n=>d.selection[n]).map(Number);
 const sum=selected.reduce((a,b)=>a+b,0);
 if(d.selection!==null)return `Select numbers totaling ${d.lastRoll.total} • selected: ${sum}`;
 return `${name}'s turn`;
}

function rollOnline(){
 if(busy||!isMyTurn()||roomData.lastRoll!==null)return;
 busy=true;
 const d=roomData, nums=openNumbers(myPlayer(d));
 const d1=1+Math.floor(Math.random()*6),d2=1+Math.floor(Math.random()*6),total=d1+d2;
 const legal=!(nums.length===1&&nums[0]===1)&&combinations(nums,total);
 const next=(d.currentSeat+1)%d.maxPlayers;
 const nextData={lastRoll:{d1,d2,total,uid:currentUser.uid,turnNo:d.turnNo},selection:legal?{}:null,animating:false};
 // If no legal move, the chance ends immediately. If only 1 remains, same.
 if(!legal){
   nextData.currentSeat=next;nextData.turnNo=(d.turnNo||1)+1;nextData.lastRoll=null;nextData.selection=null;
 }
 update(ref(db,`games/${roomId}`),nextData).then(()=>{
   if(!legal)checkTieOrContinue();
 }).catch(e=>showError("Roll failed. Check Database rules."))
 .finally(()=>{busy=false;});
}

async function toggleOnline(n){
 if(busy||!isMyTurn()||roomData.selection===null)return;
 const d=roomData, me=myPlayer(d), nums=openNumbers(me);
 let selected=Object.keys(d.selection||{}).filter(k=>d.selection[k]).map(Number);
 if(selected.includes(n))selected=selected.filter(x=>x!==n);else selected.push(n);
 const total=d.lastRoll?.total||0,sum=selected.reduce((a,b)=>a+b,0);
 if(sum>total)return;
 if(sum!==total){
   await update(ref(db,`games/${roomId}/selection`),Object.fromEntries(selected.map(x=>[String(x),true])));
   return;
 }
 busy=true;
 const newOpen=Object.fromEntries(nums.filter(x=>!selected.includes(x)).map(x=>[String(x),true]));
 const winner=Object.keys(newOpen).length===0;
 const updates={selection:null,lastRoll:null};
 selected.forEach(x=>updates[`players/${currentUser.uid}/open/${x}`]=null);
 if(winner){
   await finishRoundOnline("winner");
 }else{
   updates.currentSeat=(d.currentSeat+1)%d.maxPlayers;
   updates.turnNo=(d.turnNo||1)+1;
   await update(ref(db,`games/${roomId}`),updates);
   await checkTieOrContinue();
 }
 busy=false;
}

async function clearOnlineSelection(){
 if(!isMyTurn()||roomData.selection===null)return;
 await set(ref(db,`games/${roomId}/selection`),{});
}

async function checkTieOrContinue(){
 const d=(await get(ref(db,`games/${roomId}`))).val();
 if(!d||d.status!=="playing")return;
 const allOne=Object.values(d.players||{}).every(p=>openNumbers(p).length===1&&openNumbers(p)[0]===1);
 if(allOne)await finishRoundOnline("tie");
}

async function finishRoundOnline(result){
 const d=(await get(ref(db,`games/${roomId}`))).val();
 if(!d||d.status!=="playing")return;
 const updates={status:"roundResult",roundMessage:result};
 Object.entries(d.players||{}).forEach(([uid,p])=>{
   const value=pendingValue(openNumbers(p));
   updates[`players/${uid}/score`]=(p.score||0)+value;
 });
 if(d.round>=d.maxRounds){
   updates.status="gameOver";
 }
 await update(ref(db,`games/${roomId}`),updates);
}

function renderRoundResult(){
 const d=roomData;
 const text=d.roundMessage==="tie"?"Round tie":"Round complete";
 const nextButton=d.round<d.maxRounds&&d.hostUid===currentUser.uid?`<button class="primary" onclick="nextRoundOnline()">Next round</button>`:
  (d.round<d.maxRounds?`<div class="notice">Waiting for the host to start the next round.</div>`:"");
 app.innerHTML=`
 <div class="brand"><h1>Shut the Box</h1><div class="tagline">ONLINE GAME</div></div>
 <div class="round">Round ${d.round} / ${d.maxRounds}</div>
 <section class="card modal-box" style="margin:0 auto">
  <h2>${d.roundMessage==="tie"?"🤝":"✓"} ${text}</h2>
  <p>The pending numbers have been added to each player's total.</p>
  ${nextButton}
  <button class="bottom-btn" onclick="leaveRoom()">Leave game</button>
 </section>`;
}

async function nextRoundOnline(){
 const d=roomData;if(d.hostUid!==currentUser.uid||d.status!=="roundResult")return;
 const open=Object.fromEntries(Array.from({length:10},(_,i)=>[String(i+1),true]));
 const updates={status:"playing",round:d.round+1,currentSeat:0,turnNo:(d.turnNo||1)+1,lastRoll:null,selection:null,roundMessage:null};
 Object.keys(d.players||{}).forEach(uid=>updates[`players/${uid}/open`]=open);
 await update(ref(db,`games/${roomId}`),updates);
}

function renderGameOver(){
 const d=roomData, entries=playerEntries(d), max=Math.max(...entries.map(([,p])=>p.score||0));
 const losers=entries.filter(([,p])=>(p.score||0)===max).map(([,p])=>p.name||`Player ${p.seat+1}`);
 app.innerHTML=`
 <div class="brand"><h1>Shut the Box</h1><div class="tagline">ONLINE GAME</div></div>
 <section class="card modal-box">
  <h2>🏁 Game Over</h2>
  <p>After ${d.maxRounds} rounds, the highest total is <b>${max}</b>.</p>
  <p><b>${losers.map(esc).join(", ")}</b> ${losers.length===1?"is":"are"} the loser${losers.length===1?"":"s"}.</p>
  ${entries.map(([,p])=>`<p>${esc(p.name)} — <b>${p.score||0}</b></p>`).join("")}
  <button class="primary" onclick="leaveRoom()">New game</button>
 </section>`;
}

async function leaveRoom(){
 if(unsubscribeRoom){unsubscribeRoom();unsubscribeRoom=null;}
 await setConnected(false);
 roomId=null;roomData=null;S.screen="setup";S.names=Array(4).fill("");S.localSeat=null;clearError();render();
}

function showRules(){
 modal.innerHTML=`<div class="card modal-box">
  <h2>How to play</h2>
  <p>Both dice are rolled on every turn. Select open numbers whose sum equals the dice total. Close all <b>1–10</b> to win the round.</p>
  <p>If only 1 remains, the player may roll but cannot finish. If every player reaches only 1, the round is a tie and everyone gets 1 point.</p>
  <p>Turns always move in strict order. After 5 rounds, the highest cumulative total loses.</p>
  <button class="primary" onclick="modal.classList.add('hidden')">Got it</button>
 </div>`;
 modal.classList.remove("hidden");
}

window.setPlayers=setPlayers;window.createGame=createGame;window.joinGame=joinGame;window.copyRoom=copyRoom;
window.startOnlineGame=startOnlineGame;window.rollOnline=rollOnline;window.toggleOnline=toggleOnline;
window.clearOnlineSelection=clearOnlineSelection;window.nextRoundOnline=nextRoundOnline;window.leaveRoom=leaveRoom;
window.showRules=showRules;

onAuthStateChanged(auth,user=>{
 currentUser=user;
 if(user){render();setConnected(true).catch(()=>{});}

});
